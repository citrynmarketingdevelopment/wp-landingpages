<!-- Generated by optimax/events/build.py. Edit events.json and this template, then rebuild. -->
<!-- webhook retrigger $build_date optimax-$slug -->
<style>
$styles
</style>
<main class="opx-events" id="opx-event">
  <section class="ev-hero" aria-labelledby="event-heading">
    <div class="ev-wrap">
      <a class="ev-back" href="/events/">&larr; All events</a>
      <div class="ev-hero-grid">
        <div class="ev-hero-copy">
          <p class="ev-eyebrow">$category</p>
          <p class="ev-status">$status &middot; $date_label</p>
          <h1 id="event-heading">$headline</h1>
          <p class="ev-lead">$intro</p>
          <div class="ev-actions">
            <a class="ev-btn ev-btn-orange" href="/contact-us/">Connect with our team</a>
            <a class="ev-text-link" href="$organizer_url" target="_blank" rel="noopener noreferrer">$organizer_label <span aria-hidden="true">↗</span><span class="ev-sr-only"> (opens in a new tab)</span></a>
          </div>
        </div>
        <figure class="ev-hero-media ev-poster">
          $hero_image
        </figure>
      </div>
    </div>
  </section>
  <section class="ev-facts" aria-label="Event at a glance">
    <div class="ev-wrap ev-facts-grid">
      <div><h2>When</h2><p>$date_html</p></div>
      <div><h2>Where</h2><p>$location</p></div>
      <div><h2>$detail_label</h2><p>$detail</p></div>
    </div>
  </section>
  <section class="ev-section ev-white" aria-labelledby="connection-heading">
    <div class="ev-wrap ev-body-grid">
      <div>
        <p class="ev-eyebrow">Together with Optimax</p>
        <h2 id="connection-heading">$body_heading</h2>
      </div>
      <div class="ev-body-copy">
        <p>$body</p>
        $note_html
        <a class="ev-text-link" href="/contact-us/">Get in touch <span aria-hidden="true">&rarr;</span></a>
      </div>
    </div>
    $topics_html
  </section>
  $gallery_html
</main>

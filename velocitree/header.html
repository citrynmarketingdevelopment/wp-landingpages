<!-- Velocitree GitPress managed header | version 2026-09-11.6 -->
<style>
  @font-face { font-family: "VTS Sans"; font-style: normal; font-weight: 400; font-display: swap; src: url("https://raw.githubusercontent.com/citrynmarketingdevelopment/wp-landingpages/main/velocitree/assets/fonts/manrope-400.ttf") format("truetype"); }
  @font-face { font-family: "VTS Sans"; font-style: normal; font-weight: 500; font-display: swap; src: url("https://raw.githubusercontent.com/citrynmarketingdevelopment/wp-landingpages/main/velocitree/assets/fonts/manrope-500.ttf") format("truetype"); }
  @font-face { font-family: "VTS Sans"; font-style: normal; font-weight: 600; font-display: swap; src: url("https://raw.githubusercontent.com/citrynmarketingdevelopment/wp-landingpages/main/velocitree/assets/fonts/manrope-600.ttf") format("truetype"); }
  @font-face { font-family: "VTS Sans"; font-style: normal; font-weight: 700; font-display: swap; src: url("https://raw.githubusercontent.com/citrynmarketingdevelopment/wp-landingpages/main/velocitree/assets/fonts/manrope-700.ttf") format("truetype"); }
  @font-face { font-family: "VTS Sans"; font-style: normal; font-weight: 800; font-display: swap; src: url("https://raw.githubusercontent.com/citrynmarketingdevelopment/wp-landingpages/main/velocitree/assets/fonts/manrope-800.ttf") format("truetype"); }
  .vts-header, .vts-header * { box-sizing: border-box; }
  .vts-header {
    position: sticky;
    top: 0;
    z-index: 100;
    width: 100%;
    margin: 0;
    padding: 0;
    border-bottom: 1px solid rgb(195 139 89 / 19%);
    background: #111511;
    color: #f3f3ec !important;
    font-family: "VTS Sans", Arial, Helvetica, sans-serif;
    font-size: 14px;
    line-height: 1.4;
  }
  .vts-header p, .vts-header ul, .vts-header li {
    margin: 0;
    padding: 0;
    color: inherit;
    font-family: inherit;
    line-height: inherit;
    letter-spacing: normal;
    text-transform: none;
  }
  .vts-header a { text-decoration: none !important; }
  .vts-header .vts-header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 32px;
    width: min(1280px, calc(100% - 80px));
    height: 79px;
    margin-inline: auto;
  }
  .vts-header .vts-brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    flex: 0 0 auto;
    color: #f3f3ec !important;
  }
  /* The emblem art is pre-trimmed with a transparent field, so it needs no crop or mask. */
  .vts-header .vts-brand-emblem {
    display: block;
    flex: 0 0 52px;
    width: 52px;
    height: 42px;
  }
  .vts-header .vts-brand-emblem img {
    display: block;
    width: 100%;
    height: 100%;
    max-width: none;
    margin: 0;
    padding: 0;
    border: 0;
    object-fit: contain;
  }
  .vts-header .vts-brand-wordmark { display: block; font-size: 27px; font-weight: 500; letter-spacing: -1.45px; line-height: 1; }
  .vts-header .vts-brand-wordmark > span { color: #c38b59 !important; }
  .vts-header .vts-brand-subline { display: block; margin-top: 6px; color: #b8beb1 !important; font-size: 8px; font-weight: 400; letter-spacing: 4px; line-height: 1; text-transform: uppercase; }
  .vts-header .vts-desktop-nav { display: flex; align-items: center; gap: 30px; margin-left: auto; }
  .vts-header .vts-desktop-nav > a { display: inline-flex; align-items: center; min-height: 44px; color: #b8beb1 !important; font-weight: 400; white-space: nowrap; transition: color 160ms ease; }
  .vts-header .vts-desktop-nav > a:hover, .vts-header .vts-desktop-nav > a[aria-current] { color: #f3f3ec !important; }
  .vts-header .vts-header-cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 11px 20px;
    border: 1px solid #526c25;
    border-radius: 3px;
    background: #526c25;
    color: #fff !important;
    font-weight: 500;
    white-space: nowrap;
    transition: background 160ms ease, border-color 160ms ease;
  }
  .vts-header .vts-header-cta:hover { background: #42581d; border-color: #718d39; }
  .vts-header a:focus-visible { outline: 2px solid #9db64d; outline-offset: 5px; }
  .vts-header .vts-skip-link { position: absolute; top: 8px; left: 20px; z-index: 105; padding: 12px 18px; transform: translateY(-150%); background: #f3f3ec; color: #111511 !important; font-weight: 700; }
  .vts-header .vts-skip-link:focus { transform: translateY(0); }
  .vts-header-spacer { display: none; }
  .vts-header.scrolled { box-shadow: 0 8px 26px rgb(0 0 0 / 12%); }
  @media (max-width: 850px) {
    /* Fixed rather than sticky: an ancestor with overflow/transform (common in mobile
       theme wrappers) silently cancels sticky, and the spacer keeps the page from jumping. */
    .vts-header {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
    }
    .vts-header-spacer { display: block; height: 74px; }
    .vts-header .vts-header-inner { width: calc(100% - 40px); height: 73px; gap: 12px; }
    .vts-header .vts-desktop-nav { display: none; }
    /* No hamburger on mobile: the bar is the brand plus a single call to action, which sits
       where the toggle used to. Keeping it on one line is what drives the tighter metrics. */
    .vts-header .vts-header-cta {
      flex: 0 0 auto;
      min-height: 40px !important;
      padding: 9px 14px !important;
      font-size: 14px !important;
      font-weight: 600 !important;
      line-height: 1.3 !important;
      letter-spacing: normal !important;
      white-space: nowrap !important;
      box-shadow: 0 0 22px 1px rgb(157 182 77 / 38%), 0 0 54px 10px rgb(157 182 77 / 15%);
    }
  }
  @media (max-width: 380px) {
    .vts-header .vts-brand { gap: 7px; }
    .vts-header .vts-brand-wordmark { font-size: 24px; }
    .vts-header .vts-brand-subline { font-size: 7px; letter-spacing: 3.5px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .vts-header .vts-desktop-nav > a, .vts-header .vts-header-cta { transition: none; }
  }
</style>
